#:schema node_modules/wrangler/config-schema.json
# GEEZMART on Cloudflare.
#
# IMPORTANT: the dashboard is set to run "npx wrangler deploy" as the deploy
# command. That is the WORKERS deploy path. Declaring [assets] below makes that
# command valid, so the site builds and goes live without any dashboard edit.
#
# The SPA fallback matters: Workers static assets do NOT read public/_redirects
# (that is a Pages-only feature), so deep links like /admin/products would 404.
# not_found_handling below is the Workers equivalent.
#
# To deploy to the Pages project instead, clear the dashboard "Deploy command"
# field -- see docs/DEPLOY.md.

name = "geezmart"
compatibility_date = "2025-01-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[build]
command = "npm run build"