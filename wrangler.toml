#:schema node_modules/wrangler/config-schema.json
# Cloudflare Pages configuration for GEEZMART.
#
# IMPORTANT: this project is deployed through Cloudflare PAGES (Git integration),
# NOT the Workers runtime. Set the dashboard fields to:
#   Build command:      npm run build
#   Build output dir:   dist
#   Deploy command:     (leave EMPTY)
# If a deploy command IS set, it must be "npx wrangler pages deploy dist"
# -- plain "npx wrangler deploy" targets Workers and fails with
# "Missing entry-point to Worker script".

name = "geezmart"
compatibility_date = "2025-01-01"
pages_build_output_dir = "dist"

[build]
command = "npm run build"

# Vars are read from the Cloudflare dashboard (Settings -> Environment variables).
# Do NOT put a service-role key here; that belongs in a Worker with secrets.
