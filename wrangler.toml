#:schema node_modules/wrangler/config-schema.json
# GEEZMART -- Cloudflare Pages.
#
# The dashboard runs "npx wrangler deploy" after the build. On a Pages project
# that targets the Workers runtime and fails with
#   "Missing entry-point to Worker script or to assets directory".
#
# Declaring the assets directory below makes that command valid too, so the
# deployment succeeds whether or not the dashboard field is corrected.
#
# PREFERRED dashboard settings (Workers & Pages -> your project -> Settings ->
# Builds & deployments):
#   Build command:            npm run build
#   Build output directory:   dist
#   Deploy command:           (leave EMPTY)
#
# See docs/DEPLOY.md for the full walkthrough.

name = "geezmart"
compatibility_date = "2025-01-01"
pages_build_output_dir = "dist"

# Static SPA assets. Vite emits plain files, so there is no Worker script to
# run -- assets alone are sufficient and are served with the SPA fallback
# configured in public/_redirects.
[assets]
directory = "./dist"

[build]
command = "npm run build"

# Vars are read from the Cloudflare dashboard (Settings -> Environment variables).
# Do NOT put a service-role key here; that belongs in a Worker with secrets.
